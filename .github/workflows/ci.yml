name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - name: Results reproduce from data/
        run: |
          cp results/metrics.json /tmp/committed.json
          uv run python scripts/reproduce.py
          uv run python scripts/compare_metrics.py /tmp/committed.json results/metrics.json
      - name: README matches results
        run: uv run python scripts/render_readme.py --check
